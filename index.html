<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#0d9488">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>ChronoPocket OS - Assistant PDA Accessible</title>
    
    <!-- Chargement de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Polices Google Fonts (Inter + JetBrains Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Icônes Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --pda-chassis: #1e293b;
            --pda-bezel: #0f172a;
            --lcd-bg: #f8faf9;
            --lcd-bg-dark: #060d0b;
            --lcd-ink: #090d0b;
            --lcd-accent: #0f766e;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #334155 0%, #0f172a 100%);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .font-mono-pda {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Écran LCD haute lisibilité (contraste maximal sans bruit visuel) */
        .lcd-screen {
            background-color: #f8faf9;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.25);
            color: #090d0b;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .lcd-screen.night-mode {
            background-color: #060d0b;
            color: #ffffff;
        }

        @media (min-width: 640px) {
            .pda-device {
                background: linear-gradient(145deg, #273244, #161d29);
                box-shadow: 
                    0 25px 60px -12px rgba(0, 0, 0, 0.8),
                    inset 0 1px 1px rgba(255, 255, 255, 0.2);
                border: 3px solid #475569;
            }
        }

        .hw-button {
            background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
            box-shadow: 
                0 3px 5px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border: 2px solid #0f172a;
            transition: all 0.1s ease;
        }

        .hw-button:active, .hw-button.active {
            transform: translateY(2px);
            background: #0f766e;
            border-color: #5eead4;
        }

        /* Focus très visible pour accessibilité clavier/lecteur d'écran */
        button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
            outline: 3px solid #f59e0b !important;
            outline-offset: 2px;
        }

        .stylus-slot {
            background: linear-gradient(90deg, #1e293b 0%, #475569 50%, #1e293b 100%);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.08);
        }
        ::-webkit-scrollbar-thumb {
            background: #0f766e;
            border-radius: 9999px;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-pda-view {
            animation: fadeSlideUp 0.18s ease-out forwards;
        }

        @keyframes eqWave {
            0%, 100% { height: 6px; }
            50% { height: 22px; }
        }
        .eq-bar {
            width: 4px;
            border-radius: 9999px;
            animation: eqWave 0.55s ease-in-out infinite;
        }
        .eq-bar:nth-child(2) { animation-delay: 0.12s; }
        .eq-bar:nth-child(3) { animation-delay: 0.24s; }
        .eq-bar:nth-child(4) { animation-delay: 0.08s; }
        .eq-bar:nth-child(5) { animation-delay: 0.20s; }

        @keyframes micPulse {
            0% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.85); }
            70% { box-shadow: 0 0 0 12px rgba(225, 29, 72, 0); }
            100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
        }
        .mic-listening {
            animation: micPulse 1.4s infinite;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center sm:p-4">

    <!-- BOÎTIER PDA PRINCIPAL -->
    <div id="pda-shell" class="pda-device relative w-full h-[100dvh] sm:h-[850px] sm:max-h-[95vh] sm:w-[480px] sm:rounded-[38px] flex flex-col justify-between bg-[#1e293b] sm:p-4">
        
        <!-- En-tête châssis (Desktop) -->
        <div class="hidden sm:flex items-center justify-between px-4 pt-1 pb-2.5 text-slate-200">
            <div class="flex items-center gap-2.5">
                <span id="pda-led" class="w-3 h-3 rounded-full bg-teal-400 shadow-[0_0_8px_#2dd4bf]" aria-hidden="true"></span>
                <span class="font-mono-pda text-xs tracking-widest uppercase font-bold text-white">CHRONOPOCKET <span class="text-teal-300">AI-700</span></span>
            </div>
            <button onclick="toggleNightMode()" aria-label="Basculer entre contraste clair et contraste sombre" class="text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-teal-200 border-2 border-slate-500 flex items-center gap-1.5 font-bold transition">
                <i id="theme-icon-desktop" class="ph-bold ph-moon-stars text-sm"></i>
                <span class="font-mono-pda">Contraste</span>
            </button>
        </div>

        <!-- Stylet latéral (Desktop) -->
        <button onclick="triggerStylusTip()" aria-label="Astuce d'utilisation" class="hidden sm:flex flex-col items-center justify-between py-3 stylus-slot w-4 h-44 rounded-r-lg absolute -right-4 top-28 border-y border-r border-slate-400 cursor-pointer group">
            <span class="w-2.5 h-3.5 bg-teal-400 rounded-t-sm group-hover:h-5 transition-all"></span>
            <span class="text-[9px] font-mono-pda text-slate-200 [writing-mode:vertical-rl] tracking-widest font-bold">STYLUS</span>
        </button>

        <!-- ÉCRAN TACTILE LCD HAUTE LISIBILITÉ -->
        <div id="lcd-container" class="lcd-screen flex-1 flex flex-col overflow-hidden sm:rounded-2xl border-4 border-[#0f172a] relative">
            
            <!-- BARRE D'ÉTAT SYSTÈMES LCD -->
            <header class="bg-[#0f172a] text-white px-3 py-2 flex items-center justify-between text-sm font-mono-pda border-b-2 border-teal-600 shrink-0">
                <div class="flex items-center gap-2">
                    <span id="status-clock" class="font-extrabold text-teal-300 text-base tracking-tight">12:00</span>
                    <span class="text-slate-400" aria-hidden="true">|</span>
                    <span id="status-date" class="text-xs font-bold text-white truncate max-w-[95px]">Jeu. 19 Nov</span>
                </div>
                
                <div class="flex items-center gap-1.5">
                    <!-- Bouton Installation PWA -->
                    <button id="pwa-install-btn" onclick="installPWA()" aria-label="Installer l'application" class="hidden bg-teal-600 hover:bg-teal-500 text-white text-xs px-2.5 py-1.5 rounded-lg font-sans font-bold flex items-center gap-1 border border-teal-300">
                        <i class="ph-bold ph-download-simple"></i> App
                    </button>

                    <!-- Bouton Taille Texte Rapide (Accessibilité Malvoyants) -->
                    <button onclick="cycleFontSize()" aria-label="Changer la taille du texte" title="Agrandir ou réduire le texte" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-amber-300 border border-amber-400/60 flex items-center gap-1 font-sans font-extrabold text-xs transition">
                        <i class="ph-bold ph-text-aa text-sm"></i>
                        <span id="font-size-badge">Aa+</span>
                    </button>

                    <!-- Bouton Muet / Voix active -->
                    <button id="tts-mute-btn" onclick="toggleAutoSpeak()" aria-label="Activer ou couper la lecture vocale" class="px-2.5 py-1.5 rounded-lg bg-teal-800 hover:bg-teal-700 text-white border border-teal-400 flex items-center gap-1 transition">
                        <i id="tts-mute-icon" class="ph-fill ph-speaker-high text-base"></i>
                    </button>

                    <!-- Bouton Réglages Vocaux & Accessibilité -->
                    <button onclick="openVoiceSettingsModal()" aria-label="Ouvrir les réglages de voix et d'affichage" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-white border border-slate-500 flex items-center gap-1 transition font-sans font-bold text-xs">
                        <i class="ph-bold ph-sliders-horizontal text-sm text-teal-300"></i>
                        <span>Réglages</span>
                    </button>

                    <!-- Bouton Contraste Mobile -->
                    <button onclick="toggleNightMode()" aria-label="Changer le contraste clair ou sombre" class="sm:hidden bg-slate-800 text-teal-300 p-1.5 rounded-lg border border-slate-500">
                        <i id="theme-icon-mobile" class="ph-bold ph-moon-stars text-base"></i>
                    </button>
                </div>
            </header>

            <!-- ONGLETS FAÇON CLASSEUR PDA -->
            <nav id="folder-tabs" aria-label="Navigation principale" class="bg-[#dce5df] border-b-2 border-slate-400 px-2 pt-2 flex items-end gap-1.5 shrink-0">
                <button onclick="switchTab('assistant')" data-tab="assistant" class="tab-btn flex-1 py-2.5 px-2 rounded-t-xl text-sm font-extrabold flex items-center justify-center gap-1.5 border-t-2 border-x-2 border-slate-600 bg-[#f8faf9] text-slate-950 transition-all">
                    <i class="ph-fill ph-robot text-teal-700 text-lg"></i>
                    <span>Assistant</span>
                </button>
                <button onclick="switchTab('planning')" data-tab="planning" class="tab-btn flex-1 py-2.5 px-2 rounded-t-xl text-sm font-bold flex items-center justify-center gap-1.5 border-t-2 border-x-2 border-transparent bg-[#cbd5e1] text-slate-900 transition-all">
                    <i class="ph-fill ph-calendar-blank text-amber-700 text-lg"></i>
                    <span>Agenda</span>
                    <span id="badge-tasks" class="bg-amber-700 text-white text-xs px-2 py-0.5 rounded-full font-mono-pda font-bold">2</span>
                </button>
                <button onclick="switchTab('inventaire')" data-tab="inventaire" class="tab-btn flex-1 py-2.5 px-2 rounded-t-xl text-sm font-bold flex items-center justify-center gap-1.5 border-t-2 border-x-2 border-transparent bg-[#cbd5e1] text-slate-900 transition-all">
                    <i class="ph-fill ph-magnifying-glass text-indigo-700 text-lg"></i>
                    <span>Affaires</span>
                    <span id="badge-items" class="bg-indigo-700 text-white text-xs px-2 py-0.5 rounded-full font-mono-pda font-bold">5</span>
                </button>
            </nav>

            <!-- ZONE CONTENU DYNAMIQUE -->
            <main id="screen-content" class="flex-1 overflow-y-auto p-3.5 space-y-3.5 relative">
                <!-- Rendu dynamique par JS -->
            </main>

            <!-- BANDEAU ÉCOUTE VOCALE ET ÉGALISEUR -->
            <div id="voice-status-banner" role="status" aria-live="polite" class="hidden px-3.5 py-2.5 bg-slate-950 text-white border-t-2 border-teal-400 flex items-center justify-between gap-2 text-sm shrink-0">
                <div class="flex items-center gap-2.5 min-w-0">
                    <div id="voice-eq" class="flex items-center gap-1 h-5 shrink-0" aria-hidden="true">
                        <span class="eq-bar bg-teal-400"></span>
                        <span class="eq-bar bg-emerald-400"></span>
                        <span class="eq-bar bg-teal-300"></span>
                        <span class="eq-bar bg-amber-400"></span>
                        <span class="eq-bar bg-teal-400"></span>
                    </div>
                    <span id="voice-live-text" class="font-mono-pda text-sm font-bold truncate text-teal-200">Écoute en cours...</span>
                </div>
                <button onclick="stopAllVoiceActivity()" class="text-xs px-3 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-500 text-white font-extrabold shrink-0 border border-white">
                    Arrêter
                </button>
            </div>

            <!-- BARRE DE COMMANDE INTELLIGENTE PERMANENTE -->
            <div class="p-2.5 bg-[#e2e8f0] border-t-2 border-slate-400 shrink-0" id="smart-bar-container">
                <form onsubmit="handleSmartCommand(event)" class="flex items-center gap-2">
                    <button 
                        type="button" 
                        id="mic-btn" 
                        onclick="toggleSpeechRecognition()" 
                        aria-label="Dicter une commande vocale" 
                        class="p-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-teal-300 border-2 border-teal-500 shadow flex items-center justify-center transition shrink-0"
                    >
                        <i id="mic-icon" class="ph-fill ph-microphone text-xl"></i>
                    </button>

                    <div class="relative flex-1">
                        <label for="smart-input" class="sr-only">Votre demande pour l'assistant</label>
                        <input 
                            type="text" 
                            id="smart-input" 
                            autocomplete="off"
                            placeholder="Écrivez ou dictez ici..." 
                            class="w-full px-3.5 py-3 text-base rounded-xl bg-white text-slate-950 placeholder-slate-600 border-2 border-slate-500 focus:outline-none focus:border-teal-700 font-semibold"
                        >
                    </div>
                    <button type="submit" aria-label="Envoyer la demande" class="p-3 rounded-xl bg-teal-700 hover:bg-teal-600 active:scale-95 text-white border-2 border-teal-900 shadow flex items-center justify-center transition shrink-0">
                        <i class="ph-bold ph-paper-plane-right text-xl"></i>
                    </button>
                </form>
            </div>

            <!-- TOAST DE NOTIFICATION INTERNE -->
            <div id="pda-toast" role="alert" class="pointer-events-none opacity-0 transition-all duration-200 absolute top-14 left-3 right-3 z-40 bg-slate-950 text-white border-2 border-teal-400 px-4 py-3 rounded-xl shadow-xl text-sm font-bold flex items-center gap-2.5">
                <i class="ph-fill ph-check-circle text-teal-400 text-xl shrink-0"></i>
                <span id="pda-toast-msg">Action enregistrée.</span>
            </div>

            <!-- MODALE INTERNE PDA -->
            <div id="pda-modal" role="dialog" aria-modal="true" class="hidden absolute inset-0 z-50 bg-slate-950/80 flex items-end sm:items-center justify-center p-3">
                <div id="pda-modal-box" class="w-full max-w-md bg-white text-slate-950 rounded-2xl border-4 border-slate-800 shadow-2xl overflow-hidden animate-pda-view">
                    <!-- Contenu injecté -->
                </div>
            </div>

        </div>

        <!-- BOUTONS MATÉRIELS DU BAS -->
        <footer class="pt-2.5 pb-2 px-2 sm:px-1 bg-[#1e293b] sm:bg-transparent border-t-2 border-slate-600 sm:border-0 shrink-0">
            <div class="grid grid-cols-4 gap-2 items-center">
                <button onclick="switchTab('assistant')" data-hw="assistant" class="hw-button py-2.5 px-1 rounded-xl flex flex-col items-center justify-center gap-1 text-white cursor-pointer active">
                    <i class="ph-fill ph-robot text-xl text-teal-300"></i>
                    <span class="text-xs font-mono-pda uppercase font-bold tracking-wider">IA</span>
                </button>
                <button onclick="switchTab('planning')" data-hw="planning" class="hw-button py-2.5 px-1 rounded-xl flex flex-col items-center justify-center gap-1 text-white cursor-pointer">
                    <i class="ph-fill ph-calendar-blank text-xl text-amber-300"></i>
                    <span class="text-xs font-mono-pda uppercase font-bold tracking-wider">Agenda</span>
                </button>
                <button onclick="switchTab('inventaire')" data-hw="inventaire" class="hw-button py-2.5 px-1 rounded-xl flex flex-col items-center justify-center gap-1 text-white cursor-pointer">
                    <i class="ph-fill ph-magnifying-glass text-xl text-indigo-300"></i>
                    <span class="text-xs font-mono-pda uppercase font-bold tracking-wider">Affaires</span>
                </button>
                <button id="hw-mic-btn" onclick="toggleSpeechRecognition()" aria-label="Activer la dictée vocale" class="hw-button py-2.5 px-1 rounded-xl flex flex-col items-center justify-center gap-1 text-white cursor-pointer border-teal-400">
                    <i id="hw-mic-icon" class="ph-fill ph-microphone text-xl text-rose-400"></i>
                    <span id="hw-mic-label" class="text-xs font-mono-pda uppercase font-bold tracking-wider">Parler</span>
                </button>
            </div>
        </footer>
    </div>

    <script>
        /**
         * ============================================================================
         * CHRONOPOCKET OS - MOTEUR PWA ACCESSIBLE & ASSISTANT VOCAL
         * ============================================================================
         */

        // --- 1. CONFIGURATION PWA & ICÔNE ADAPTÉE AUX COULEURS DE L'APP ---
        (function initPWA() {
            try {
                // Icône PDA inspirée du visuel fourni, adaptée à la palette ChronoPocket (#1e293b, #0d9488, #eef3ef)
                const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                    <rect width="512" height="512" rx="112" fill="#0d9488"/>
                    <!-- Ondes radio en haut à droite -->
                    <path d="M292 66a46 46 0 0 1 46 46" stroke="#0f172a" stroke-width="18" stroke-linecap="round" fill="none"/>
                    <path d="M292 34a78 78 0 0 1 78 78" stroke="#0f172a" stroke-width="18" stroke-linecap="round" fill="none"/>
                    <!-- Antenne -->
                    <rect x="284" y="88" width="28" height="44" rx="14" fill="#0f172a"/>
                    <!-- Châssis externe du PDA -->
                    <rect x="128" y="114" width="256" height="354" rx="44" fill="#1e293b" stroke="#0f172a" stroke-width="18"/>
                    <!-- Écran LCD haute visibilité -->
                    <rect x="164" y="152" width="184" height="218" rx="16" fill="#eef3ef" stroke="#2dd4bf" stroke-width="10"/>
                    <!-- Contenu minimaliste sur l'écran (lignes de texte contrastées) -->
                    <rect x="188" y="182" width="90" height="16" rx="8" fill="#0f766e"/>
                    <rect x="188" y="214" width="136" height="14" rx="7" fill="#1e293b"/>
                    <rect x="188" y="242" width="112" height="14" rx="7" fill="#1e293b"/>
                    <!-- Boutons matériels inférieurs -->
                    <rect x="172" y="406" width="32" height="16" rx="8" fill="#5eead4"/>
                    <circle cx="256" cy="414" r="22" fill="none" stroke="#5eead4" stroke-width="14"/>
                    <rect x="308" y="406" width="32" height="16" rx="8" fill="#5eead4"/>
                </svg>`;
                
                const iconUrl = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgIcon)));

                // Ajout dynamique du Favicon et de l'icône Apple Touch
                const favicon = document.createElement('link');
                favicon.rel = 'icon';
                favicon.type = 'image/svg+xml';
                favicon.href = iconUrl;
                document.head.appendChild(favicon);

                const appleIcon = document.createElement('link');
                appleIcon.rel = 'apple-touch-icon';
                appleIcon.href = iconUrl;
                document.head.appendChild(appleIcon);

                const manifest = {
                    name: "ChronoPocket OS - Assistant PDA Accessible",
                    short_name: "ChronoPocket",
                    description: "Assistant personnel intelligent haute visibilité pour planning et inventaire.",
                    start_url: location.href,
                    display: "standalone",
                    background_color: "#1e293b",
                    theme_color: "#0d9488",
                    icons: [
                        { src: iconUrl, sizes: "192x192", type: "image/svg+xml", purpose: "any maskable" },
                        { src: iconUrl, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }
                    ]
                };

                const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
                const linkEl = document.createElement('link');
                linkEl.rel = 'manifest';
                linkEl.href = URL.createObjectURL(manifestBlob);
                document.head.appendChild(linkEl);
            } catch (err) {}
        })();

        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const btn = document.getElementById('pwa-install-btn');
            if (btn) btn.classList.remove('hidden');
        });

        async function installPWA() {
            if (!deferredPrompt) {
                showToast("Utilisez 'Ajouter à l'écran d'accueil' dans votre navigateur.");
                return;
            }
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                showToast("Installation de ChronoPocket lancée !");
            }
            deferredPrompt = null;
            document.getElementById('pwa-install-btn').classList.add('hidden');
        }

        // --- 2. ÉTAT DE L'APPLICATION ---
        const STORAGE_KEY = 'chronopocket_os_accessible_v4';

        function getTodayISO(offsetDays = 0) {
            const d = new Date();
            d.setDate(d.getDate() + offsetDays);
            return d.toISOString().split('T')[0];
        }

        const DEFAULT_DATA = {
            nightMode: false,
            activeTab: 'assistant',
            voiceSettings: {
                autoSpeak: true,
                continuousConversation: false,
                voiceURI: '',
                preset: 'calm',
                rate: 0.95,
                pitch: 1.05,
                fontSize: 'large' // Activé en 'large' par défaut pour le confort visuel
            },
            chatHistory: [
                {
                    sender: 'ai',
                    time: '08:30',
                    text: "Bonjour ! L'interface haute lisibilité est activée. Utilisez le bouton « Aa+ » en haut pour agrandir encore le texte, ou appuyez sur le micro pour me parler."
                }
            ],
            events: [
                {
                    id: 'ev-1',
                    title: 'Rendez-vous Banque & Prêt Immobilier',
                    date: getTodayISO(0),
                    time: '14:30',
                    priority: 'high',
                    done: false,
                    linkedItemHint: 'Dossier Impôts & Revenus',
                    notes: 'Apporter les 3 derniers bulletins de salaire.'
                },
                {
                    id: 'ev-2',
                    title: 'Récupérer colis point relais',
                    date: getTodayISO(0),
                    time: '17:45',
                    priority: 'normal',
                    done: false,
                    linkedItemHint: '',
                    notes: 'Code reçu par SMS.'
                },
                {
                    id: 'ev-3',
                    title: 'Contrôle technique voiture',
                    date: getTodayISO(1),
                    time: '09:15',
                    priority: 'high',
                    done: false,
                    linkedItemHint: 'Double clés voiture',
                    notes: 'Centre Auto Nord.'
                }
            ],
            items: [
                {
                    id: 'it-1',
                    name: 'Passeport & Livret de famille',
                    category: 'Dossiers/Papiers',
                    location: 'Tiroir bureau gauche (fermé à clé)',
                    updatedAt: getTodayISO(-2),
                    notes: 'Pochette transparente avec photos.'
                },
                {
                    id: 'it-2',
                    name: 'Dossier Impôts & Revenus',
                    category: 'Dossiers/Papiers',
                    location: 'Classeur bleu — Étagère salon (2e niveau)',
                    updatedAt: getTodayISO(-5),
                    notes: 'Avis d’imposition.'
                },
                {
                    id: 'it-3',
                    name: 'Double clés voiture + Carte grise',
                    category: 'Clés/Quotidien',
                    location: 'Vide-poche entrée (boîte bois)',
                    updatedAt: getTodayISO(-1),
                    notes: 'Porte-clés cuir.'
                },
                {
                    id: 'it-4',
                    name: 'Disque dur SSD Sauvegarde',

        function loadSystemVoices() {
            if (!('speechSynthesis' in window)) return;
            const voices = window.speechSynthesis.getVoices();
            if (voices.length > 0) {
                availableVoices = [...voices].sort((a, b) => {
                    const aFr = a.lang.toLowerCase().startsWith('fr') ? 0 : 1;
                    const bFr = b.lang.toLowerCase().startsWith('fr') ? 0 : 1;
                    if (aFr !== bFr) return aFr - bFr;
                    return a.name.localeCompare(b.name);
                });
                if (!appState.voiceSettings.voiceURI) {
                    const defaultFr = availableVoices.find(v => v.lang.toLowerCase().startsWith('fr'));
                    if (defaultFr) {
                        appState.voiceSettings.voiceURI = defaultFr.voiceURI;
                        saveState();
                    }
                }
            }
        }

        if ('speechSynthesis' in window) {
            loadSystemVoices();
            window.speechSynthesis.onvoiceschanged = loadSystemVoices;
        }

            if (VOICE_PRESETS[presetKey]) {

                appState.voiceSettings.pitch = VOICE_PRESETS[presetKey].pitch;

        function toggleAutoSpeak() {
            appState.voiceSettings.autoSpeak = !appState.voiceSettings.autoSpeak;

                window.speechSynthesis.cancel();

        function cleanTextForSpeech(rawText) {
            return String(rawText)
                .replace(/<[^>]*>/g, ' ')
                .replace(/[📍•✨🔹🔸📦🗓️📋]/g, ' ')
                .replace(/→/g, ' vers ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function speakText(rawText, forceSpeak = false, onCompleteCallback = null) {
            if (!('speechSynthesis' in window)) return;
            if (!forceSpeak && !appState.voiceSettings.autoSpeak) {
                if (onCompleteCallback) onCompleteCallback();
                return;
            }

            const text = cleanTextForSpeech(rawText);
            if (!text) return;

            window.speechSynthesis.cancel();
            if (availableVoices.length === 0) loadSystemVoices();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR';

            const chosenVoice = availableVoices.find(v => v.voiceURI === appState.voiceSettings.voiceURI)
                || availableVoices.find(v => v.lang.toLowerCase().startsWith('fr'));
            if (chosenVoice) utterance.voice = chosenVoice;

            utterance.rate = Number(appState.voiceSettings.rate) || 0.95;
            utterance.pitch = Number(appState.voiceSettings.pitch) || 1.05;

            utterance.onstart = () => {
                isSpeaking = true;
                updateVoiceBanner('speaking', `Lecture vocale en cours...`);
            };
            utterance.onend = () => {
                isSpeaking = false;
                if (!isListening) updateVoiceBanner('idle');
                if (onCompleteCallback) onCompleteCallback();
            };
            utterance.onerror = () => {
                isSpeaking = false;
                if (!isListening) updateVoiceBanner('idle');
            };

            window.speechSynthesis.speak(utterance);
        }

        function stopAllVoiceActivity() {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            isSpeaking = false;
            if (speechRecognition && isListening) {
                try { speechRecognition.stop(); } catch (e) {}
            }
            isListening = false;
            updateMicButtonsUI(false);
            updateVoiceBanner('idle');

        function toggleSpeechRecognition() {
            if (isListening) {
                if (speechRecognition) {
                    try { speechRecognition.stop(); } catch (e) {}
                }
                isListening = false;
                updateMicButtonsUI(false);
                updateVoiceBanner('idle');
                return;
            }
            startSpeechRecognition();
        }

        function startSpeechRecognition() {
            const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognitionAPI) {
                showToast("Reconnaissance vocale non supportée sur ce navigateur.");
                return;
            }

            if ('speechSynthesis' in window && isSpeaking) {
                window.speechSynthesis.cancel();
                isSpeaking = false;
            }

            try {
                speechRecognition = new SpeechRecognitionAPI();
                speechRecognition.lang = 'fr-FR';
                speechRecognition.interimResults = true;
                speechRecognition.maxAlternatives = 1;
                speechRecognition.continuous = false;

                let finalTranscript = '';

                speechRecognition.onstart = () => {
                    isListening = true;
                    updateMicButtonsUI(true);
                    updateVoiceBanner('listening', 'Je vous écoute...');
                };

                speechRecognition.onresult = (event) => {
                    let interimTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        const transcript = event.results[i][0].transcript;
                        if (event.results[i].isFinal) finalTranscript += transcript;
                        else interimTranscript += transcript;
                    }
                    const currentText = (finalTranscript || interimTranscript).trim();
                    if (currentText) {
                        updateVoiceBanner('listening', `« ${currentText} »`);
                        const inputEl = document.getElementById('smart-input');
                        if (inputEl) inputEl.value = currentText;
                    }
                };

                speechRecognition.onerror = () => {
                    isListening = false;
                    updateMicButtonsUI(false);
                    updateVoiceBanner('idle');
                    showToast("Erreur micro ou accès refusé.");
                };

                speechRecognition.onend = () => {
                    isListening = false;
                    updateMicButtonsUI(false);
                    updateVoiceBanner('idle');
                    const inputEl = document.getElementById('smart-input');
                    const spokenCommand = (finalTranscript || (inputEl ? inputEl.value : '')).trim();
                    if (spokenCommand) {
                        if (inputEl) inputEl.value = spokenCommand;
                        handleSmartCommand(new Event('submit'));
                    }
                };

                speechRecognition.start();
            } catch (err) {
                isListening = false;
                updateMicButtonsUI(false);
                showToast("Impossible de démarrer le microphone.");
            }
        }

        // --- 8. MOTEUR D'INTERPRÉTATION INTELLIGENT ---
        function handleSmartCommand(e) {
            e.preventDefault();
            const inputEl = document.getElementById('smart-input');
            if (!inputEl) return;
            const text = inputEl.value.trim();
            if (!text) return;

            inputEl.value = '';
            addChatMessage('user', text);
            processAssistantQuery(text);
        }

        function addChatMessage(sender, text) {
            const time = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            appState.chatHistory.push({ sender, time, text });
            saveState();
            if (appState.activeTab === 'assistant') renderCurrentTab();
        }

        function processAssistantQuery(query) {
            const lower = query.toLowerCase();
            let aiResponse = "";

            if (lower.includes('où est') || lower.includes('ou est') || lower.includes('recherche') || lower.includes('cherche')) {
                const foundItem = appState.items.find(item => lower.split(' ').some(word => word.length > 3 && item.name.toLowerCase().includes(word)));
                if (foundItem) {
                    aiResponse = `📦 L'objet « ${foundItem.name} » est rangé ici :\n📍 ${foundItem.location}\n${foundItem.notes ? 'Note : ' + foundItem.notes : ''}`;
                } else {
                    aiResponse = `Je n'ai pas trouvé d'objet correspondant dans votre inventaire. Vous pouvez l'ajouter dans l'onglet Affaires.`;
                }
            } 
            else if (lower.includes('rdv') || lower.includes('rendez-vous') || lower.includes('demain') || lower.includes('agenda')) {
                const title = query.replace(/rdv|rendez-vous|demain|aujourd'hui|à/gi, '').trim() || 'Nouveau rendez-vous';
                const date = lower.includes('demain') ? getTodayISO(1) : getTodayISO(0);
                const newEv = {
                    id: 'ev-' + Date.now(),
                    title: title.charAt(0).toUpperCase() + title.slice(1),
                    date: date,
                    time: '14:00',
                    priority: 'normal',
                    done: false,
                    linkedItemHint: '',
                    notes: 'Ajouté par assistant.'
                };
                appState.events.push(newEv);
                saveState();
                aiResponse = `🗓️ Rendez-vous ajouté pour le ${date} : « ${newEv.title} ».`;
            } 
            else if (lower.includes('briefing') || lower.includes('résumé') || lower.includes('programme')) {
                const todayEvs = appState.events.filter(e => e.date === getTodayISO(0) && !e.done);
                aiResponse = `📋 Résumé du jour (${getTodayISO(0)}) :\n• Vous avez ${todayEvs.length} rendez-vous en attente.\n• Votre inventaire contient ${appState.items.length} objets répertoriés.`;
            }
            else {
                aiResponse = `Je peux retrouver un objet (« Où est mon passeport ? ») ou ajouter un rendez-vous (« Rdv médecin demain »). Que souhaitez-vous faire ?`;
            }

            addChatMessage('ai', aiResponse);
            speakText(aiResponse);
        }

        function quickBriefing() {
            processAssistantQuery("donne-moi le résumé");
        }

        function clearChatHistory() {
            appState.chatHistory = [{ sender: 'ai', time: new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}), text: "Discussion effacée." }];

            renderCurrentTab();

        }

            const labels = { normal: '100%', large: '125%', xlarge: '150%' };
            showToast(`Taille du texte : ${labels[size]}`);
            speakText(`Taille du texte réglée à ${labels[size]}`);
        }

        function testPresetVoice(key) {
            applyVoicePreset(key);
            const select = document.getElementById('settings-voice-select');
            if (select && select.value) {
                appState.voiceSettings.voiceURI = select.value;
            }
            const preset = VOICE_PRESETS[key];
            speakText(preset.testPhrase, true);
        }

        function saveVoiceSettings() {
            const select = document.getElementById('settings-voice-select');
            const autospeak = document.getElementById('settings-autospeak');
            if (select) appState.voiceSettings.voiceURI = select.value;
            if (autospeak) appState.voiceSettings.autoSpeak = autospeak.checked;
            saveState();
            updateMuteButtonUI();
            closeModal();
            showToast("Réglages enregistrés");
        }

        function closeModal() {
            const modal = document.getElementById('pda-modal');
            if (modal) modal.classList.add('hidden');
        }

        function setPlanningFilter(filter) {
            planningFilter = filter;
            renderCurrentTab();
        }

        function toggleEventDone(id) {
            const ev = appState.events.find(e => e.id === id);
            if (ev) {
                ev.done = !ev.done;
                saveState();
                renderCurrentTab();
                speakText(ev.done ? "Rendez-vous coché." : "Rendez-vous réactivé.");
            }
        }

        function deleteEvent(id) {
            appState.events = appState.events.filter(e => e.id !== id);
            saveState();
            renderCurrentTab();
            showToast("Rendez-vous supprimé");
        }

        function handleItemSearch(val) {
            searchQuery = val;
            renderCurrentTab();
        }

        function selectCategory(cat) {
            selectedCategory = cat;
            renderCurrentTab();
        }

        // --- INITIALISATION AU CHARGEMENT ---
        window.onload = function() {
            applyNightMode();
            updateFontSizeBadge();
            updateClock();
            setInterval(updateClock, 1000);
            updateBadges();
            updateMuteButtonUI();
            switchTab(appState.activeTab || 'assistant');
        };
    </script>
</body>
</html>
