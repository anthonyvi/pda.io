    <style>
        :root {
            --pda-chassis: #1e293b;
            --pda-bezel: #0f172a;
            --lcd-bg: #f8faf9;
            --lcd-bg-dark: #060d0b;
            --lcd-ink: #090d0b;
            --lcd-accent: #0f766e;
        }

        /* Encoche / barre d'état / barre de gestes (iPhone, Android) en mode app installée */
        @media (max-width: 639px) {
            #pda-shell {
                padding-top: env(safe-area-inset-top, 0px);
                padding-bottom: env(safe-area-inset-bottom, 0px);
                padding-left: env(safe-area-inset-left, 0px);
                padding-right: env(safe-area-inset-right, 0px);
            }
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #334155 0%, #0f172a 100%);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .font-mono-pda {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Écran LCD haute lisibilité (contraste maximal sans bruit visuel) */
        .lcd-screen {
            background-color: #f8faf9;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.25);
            color: #090d0b;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .lcd-screen.night-mode {
            background-color: #060d0b;
            color: #ffffff;
        }

        @media (min-width: 640px) {
            .pda-device {
                background: linear-gradient(145deg, #273244, #161d29);
                box-shadow: 
                    0 25px 60px -12px rgba(0, 0, 0, 0.8),
                    inset 0 1px 1px rgba(255, 255, 255, 0.2);
                border: 3px solid #475569;
            }
        }

        .hw-button {
            background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
            box-shadow: 
                0 3px 5px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border: 2px solid #0f172a;
            transition: all 0.1s ease;
        }

        .hw-button:active, .hw-button.active {
            transform: translateY(2px);
            background: #0f766e;
            border-color: #5eead4;
        }

        /* Focus très visible pour accessibilité clavier/lecteur d'écran */
        button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
            outline: 3px solid #f59e0b !important;
            outline-offset: 2px;
        }

        .stylus-slot {
            background: linear-gradient(90deg, #1e293b 0%, #475569 50%, #1e293b 100%);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.08);
        }
        ::-webkit-scrollbar-thumb {
            background: #0f766e;
            border-radius: 9999px;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-pda-view {
            animation: fadeSlideUp 0.18s ease-out forwards;
        }

        @keyframes eqWave {
            0%, 100% { height: 6px; }
            50% { height: 22px; }
        }
        .eq-bar {
            width: 4px;
            border-radius: 9999px;
            animation: eqWave 0.55s ease-in-out infinite;
        }
        .eq-bar:nth-child(2) { animation-delay: 0.12s; }
        .eq-bar:nth-child(3) { animation-delay: 0.24s; }
        .eq-bar:nth-child(4) { animation-delay: 0.08s; }
        .eq-bar:nth-child(5) { animation-delay: 0.20s; }

        @keyframes micPulse {
            0% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.85); }
            70% { box-shadow: 0 0 0 12px rgba(225, 29, 72, 0); }
            100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
        }
        .mic-listening {
            animation: micPulse 1.4s infinite;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center sm:p-4">

    <!-- BOÎTIER PDA PRINCIPAL -->
    <div id="pda-shell" class="pda-device relative w-full h-[100dvh] sm:h-[850px] sm:max-h-[95vh] sm:w-[480px] sm:rounded-[38px] flex flex-col justify-between bg-[#1e293b] sm:p-4">

        <div class="hidden sm:flex items-center justify-between px-4 pt-1 pb-2.5 text-slate-200">

            </div>
            <button onclick="toggleNightMode()" aria-label="Basculer entre contraste clair et contraste sombre" class="text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-teal-200 border-2 border-slate-500 flex items-center gap-1.5 font-bold transition">
                <i id="theme-icon-desktop" class="ph-bold ph-moon-stars text-sm"></i>
                <span class="font-mono-pda">Contraste</span>

            <span class="w-2.5 h-3.5 bg-teal-400 rounded-t-sm group-hover:h-5 transition-all"></span>

            <header class="bg-[#0f172a] text-white px-3 py-2 flex flex-wrap gap-y-1.5 items-center justify-between text-sm font-mono-pda border-b-2 border-teal-600 shrink-0">

                    <div id="voice-eq" class="flex items-center gap-1 h-5 shrink-0" aria-hidden="true">

                        <span class="eq-bar bg-emerald-400"></span>
                        <span class="eq-bar bg-teal-300"></span>
                        <span class="eq-bar bg-amber-400"></span>
                        <span class="eq-bar bg-teal-400"></span>

            <div class="p-2.5 bg-[#e2e8f0] border-t-2 border-slate-400 shrink-0" id="smart-bar-container">

                    <button

                        id="mic-btn"

                    </button>

                            type="text" 
                            id="smart-input"

                        >
                    </div>
                    <button type="submit" aria-label="Envoyer la demande" class="p-3 rounded-xl bg-teal-700 hover:bg-teal-600 active:scale-95 text-white border-2 border-teal-900 shadow flex items-center justify-center transition shrink-0">

                    </button>
                </form>
            </div>

                    <!-- Contenu injecté -->
                </div>
            </div>

            </div>

        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const btn = document.getElementById('pwa-install-btn');
            if (btn) btn.classList.remove('hidden');
        });

        async function installPWA() {
            if (!deferredPrompt) {
                showToast("Utilisez 'Ajouter à l'écran d'accueil' dans votre navigateur.");
                return;
            }
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                showToast("Installation de ChronoPocket lancée !");
            }

        function loadSystemVoices() {
            if (!('speechSynthesis' in window)) return;

            if (voices.length > 0) {

                    const aFr = a.lang.toLowerCase().startsWith('fr') ? 0 : 1;
                    const bFr = b.lang.toLowerCase().startsWith('fr') ? 0 : 1;
                    if (aFr !== bFr) return aFr - bFr;
                    return a.name.localeCompare(b.name);
                });
                if (!appState.voiceSettings.voiceURI) {
                    const defaultFr = availableVoices.find(v => v.lang.toLowerCase().startsWith('fr'));
                    if (defaultFr) {
                        appState.voiceSettings.voiceURI = defaultFr.voiceURI;
                        saveState();
                    }
                }
            }
        }

        function cleanTextForSpeech(rawText) {
            return String(rawText)
                .replace(/<[^>]*>/g, ' ')
                .replace(/[📍•✨🔹🔸📦🗓️📋]/g, ' ')
                .replace(/→/g, ' vers ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function speakText(rawText, forceSpeak = false, onCompleteCallback = null) {
            if (!('speechSynthesis' in window)) return;
            if (!forceSpeak && !appState.voiceSettings.autoSpeak) {
                if (onCompleteCallback) onCompleteCallback();
                return;
            }

            const text = cleanTextForSpeech(rawText);
            if (!text) return;

            window.speechSynthesis.cancel();
            if (availableVoices.length === 0) loadSystemVoices();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR';

            const chosenVoice = availableVoices.find(v => v.voiceURI === appState.voiceSettings.voiceURI)
                || availableVoices.find(v => v.lang.toLowerCase().startsWith('fr'));
            if (chosenVoice) utterance.voice = chosenVoice;

            utterance.rate = Number(appState.voiceSettings.rate) || 0.95;
            utterance.pitch = Number(appState.voiceSettings.pitch) || 1.05;

            utterance.onstart = () => {
                isSpeaking = true;
                updateVoiceBanner('speaking', `Lecture vocale en cours...`);
            };
            utterance.onend = () => {
                isSpeaking = false;
                if (!isListening) updateVoiceBanner('idle');
                if (onCompleteCallback) onCompleteCallback();
            };
            utterance.onerror = () => {
                isSpeaking = false;
                if (!isListening) updateVoiceBanner('idle');
            };

            window.speechSynthesis.speak(utterance);
        }

        function startSpeechRecognition() {
            const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognitionAPI) {
                showToast("Reconnaissance vocale non supportée sur ce navigateur.");
                return;
            }

            if ('speechSynthesis' in window && isSpeaking) {
                window.speechSynthesis.cancel();
                isSpeaking = false;
            }

            try {
                speechRecognition = new SpeechRecognitionAPI();
                speechRecognition.lang = 'fr-FR';
                speechRecognition.interimResults = true;
                speechRecognition.maxAlternatives = 1;
                speechRecognition.continuous = false;

                let finalTranscript = '';

                speechRecognition.onstart = () => {
                    isListening = true;
                    updateMicButtonsUI(true);
                    updateVoiceBanner('listening', 'Je vous écoute...');
                };

                speechRecognition.onresult = (event) => {
                    let interimTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        const transcript = event.results[i][0].transcript;
                        if (event.results[i].isFinal) finalTranscript += transcript;
                        else interimTranscript += transcript;
                    }
                    const currentText = (finalTranscript || interimTranscript).trim();
                    if (currentText) {
                        updateVoiceBanner('listening', `« ${currentText} »`);
                        const inputEl = document.getElementById('smart-input');
                        if (inputEl) inputEl.value = currentText;
                    }
                };

                speechRecognition.onerror = () => {
                    isListening = false;
                    updateMicButtonsUI(false);
                    updateVoiceBanner('idle');
                    showToast("Erreur micro ou accès refusé.");
                };

                speechRecognition.onend = () => {
                    isListening = false;
                    updateMicButtonsUI(false);
                    updateVoiceBanner('idle');
                    const inputEl = document.getElementById('smart-input');
                    const spokenCommand = (finalTranscript || (inputEl ? inputEl.value : '')).trim();
                    if (spokenCommand) {
                        if (inputEl) inputEl.value = spokenCommand;
                        handleSmartCommand(new Event('submit'));
                    }
                };

                speechRecognition.start();
            } catch (err) {
                isListening = false;
                updateMicButtonsUI(false);
                showToast("Impossible de démarrer le microphone.");
            }
        }

        // --- 8. MOTEUR D'INTERPRÉTATION INTELLIGENT ---
        function handleSmartCommand(e) {
            e.preventDefault();
            const inputEl = document.getElementById('smart-input');
            if (!inputEl) return;
            const text = inputEl.value.trim();
            if (!text) return;

            inputEl.value = '';
            addChatMessage('user', text);
            processAssistantQuery(text);
        }

        function addChatMessage(sender, text) {
            const time = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            appState.chatHistory.push({ sender, time, text });
            saveState();
            if (appState.activeTab === 'assistant') renderCurrentTab();
        }

        function processAssistantQuery(query) {
            const lower = query.toLowerCase();
            let aiResponse = "";

            if (lower.includes('où est') || lower.includes('ou est') || lower.includes('recherche') || lower.includes('cherche')) {
                const foundItem = appState.items.find(item => lower.split(' ').some(word => word.length > 3 && item.name.toLowerCase().includes(word)));
                if (foundItem) {
                    aiResponse = `📦 L'objet « ${foundItem.name} » est rangé ici :\n📍 ${foundItem.location}\n${foundItem.notes ? 'Note : ' + foundItem.notes : ''}`;
                } else {
                    aiResponse = `Je n'ai pas trouvé d'objet correspondant dans votre inventaire. Vous pouvez l'ajouter dans l'onglet Affaires.`;
                }
            } 
            else if (lower.includes('rdv') || lower.includes('rendez-vous') || lower.includes('demain') || lower.includes('agenda')) {
                const title = query.replace(/rdv|rendez-vous|demain|aujourd'hui|à/gi, '').trim() || 'Nouveau rendez-vous';
                const date = lower.includes('demain') ? getTodayISO(1) : getTodayISO(0);
                const newEv = {
                    id: 'ev-' + Date.now(),
                    title: title.charAt(0).toUpperCase() + title.slice(1),
                    date: date,
                    time: '14:00',
                    priority: 'normal',
                    done: false,
                    linkedItemHint: '',
                    notes: 'Ajouté par assistant.'
                };
                appState.events.push(newEv);
                saveState();
                aiResponse = `🗓️ Rendez-vous ajouté pour le ${date} : « ${newEv.title} ».`;
            } 
            else if (lower.includes('briefing') || lower.includes('résumé') || lower.includes('programme')) {
                const todayEvs = appState.events.filter(e => e.date === getTodayISO(0) && !e.done);
                aiResponse = `📋 Résumé du jour (${getTodayISO(0)}) :\n• Vous avez ${todayEvs.length} rendez-vous en attente.\n• Votre inventaire contient ${appState.items.length} objets répertoriés.`;
            }
            else {
                aiResponse = `Je peux retrouver un objet (« Où est mon passeport ? ») ou ajouter un rendez-vous (« Rdv médecin demain »). Que souhaitez-vous faire ?`;
            }

            addChatMessage('ai', aiResponse);
            speakText(aiResponse);
        }

        function quickBriefing() {
            processAssistantQuery("donne-moi le résumé");
        }

        function clearChatHistory() {
            appState.chatHistory = [{ sender: 'ai', time: new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}), text: "Discussion effacée." }];

                        <div class="p-3 rounded-xl bg-slate-100 border-2 border-slate-500 flex items-center justify-between">
                            <span class="font-extrabold text-slate-950">Mode Contraste Sombre (Fond Noir)</span>
                            <button type="button" onclick="toggleNightMode(); openVoiceSettingsModal();" class="px-3.5 py-2 rounded-xl font-extrabold border-2 ${appState.nightMode ? 'bg-amber-400 text-slate-950 border-slate-950' : 'bg-slate-900 text-white border-slate-950'}">
                                ${appState.nightMode ? 'Activé' : 'Désactivé'}
                            </button>
                        </div>

                        <div>
                            <label class="block font-extrabold mb-1.5 text-slate-950">Style de la voix</label>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                ${Object.keys(VOICE_PRESETS).map(key => `
                                    <div onclick="selectPresetFromCard('${key}')" class="p-3 rounded-xl border-2 cursor-pointer transition ${appState.voiceSettings.preset === key ? 'bg-teal-700 text-white border-teal-950 shadow' : 'bg-white text-slate-950 border-slate-500 hover:bg-slate-100'}">
                                        <div class="flex items-center justify-between font-extrabold">
                                            <span>${VOICE_PRESETS[key].label}</span>
                                            ${appState.voiceSettings.preset === key ? '<i class="ph-fill ph-check-circle text-amber-300 text-lg"></i>' : ''}
                                        </div>
                                        <p class="text-xs font-medium mt-1">${VOICE_PRESETS[key].desc}</p>
                                        <button type="button" onclick="event.stopPropagation(); testPresetVoice('${key}')" class="mt-2 text-xs px-2.5 py-1 rounded-lg font-extrabold ${appState.voiceSettings.preset === key ? 'bg-amber-400 text-slate-950' : 'bg-slate-200 text-slate-950 border border-slate-500'} flex items-center gap-1">
                                            <i class="ph-fill ph-speaker-high"></i> Écouter
                                        </button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div>
                            <label class="block font-extrabold mb-1 text-slate-950">Voix du système</label>
                            <select id="settings-voice-select" class="w-full p-2.5 rounded-xl border-2 border-slate-500 bg-white font-bold">
                                ${voiceOptionsHtml || '<option value="">Voix par défaut</option>'}
                            </select>
                        </div>

                        <div class="flex items-center justify-between bg-slate-100 p-3 rounded-xl border-2 border-slate-500">
                            <span class="font-extrabold text-slate-950">Lire les réponses à voix haute</span>
                            <input type="checkbox" id="settings-autospeak" ${appState.voiceSettings.autoSpeak ? 'checked' : ''} class="w-6 h-6 rounded text-teal-700 cursor-pointer">
                        </div>
                    </div>

                    <div class="pt-3 flex justify-end gap-2.5 border-t-2 border-slate-300">
                        <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl bg-slate-300 text-slate-950 font-bold border-2 border-slate-500">Fermer</button>
                        <button type="button" onclick="saveVoiceSettings()" class="px-4 py-2.5 rounded-xl bg-teal-700 text-white font-extrabold border-2 border-teal-950 shadow">Enregistrer</button>
                    </div>
                </div>
            `;
            modal.classList.remove('hidden');
        }

        function selectPresetFromCard(key) {
            applyVoicePreset(key);
            openVoiceSettingsModal();
        }

        function setAppFontSize(size, reopenModal = false) {
            if (!appState.voiceSettings) appState.voiceSettings = {};
            appState.voiceSettings.fontSize = size;
            saveState();
            updateFontSizeBadge();
            renderCurrentTab();
            if (reopenModal) openVoiceSettingsModal();
            const labels = { normal: '100%', large: '125%', xlarge: '150%' };
            showToast(`Taille du texte : ${labels[size]}`);
            speakText(`Taille du texte réglée à ${labels[size]}`);
        }

        function testPresetVoice(key) {
            applyVoicePreset(key);
            const select = document.getElementById('settings-voice-select');
            if (select && select.value) {
                appState.voiceSettings.voiceURI = select.value;
            }
            const preset = VOICE_PRESETS[key];
            speakText(preset.testPhrase, true);
        }

        function saveVoiceSettings() {
            const select = document.getElementById('settings-voice-select');
            const autospeak = document.getElementById('settings-autospeak');
            if (select) appState.voiceSettings.voiceURI = select.value;
            if (autospeak) appState.voiceSettings.autoSpeak = autospeak.checked;
            saveState();
            updateMuteButtonUI();
            closeModal();
            showToast("Réglages enregistrés");
        }

        function closeModal() {
            const modal = document.getElementById('pda-modal');
            if (modal) modal.classList.add('hidden');
        }

        function setPlanningFilter(filter) {
            planningFilter = filter;
            renderCurrentTab();
        }

        function toggleEventDone(id) {
            const ev = appState.events.find(e => e.id === id);
            if (ev) {
                ev.done = !ev.done;
                saveState();
                renderCurrentTab();
                speakText(ev.done ? "Rendez-vous coché." : "Rendez-vous réactivé.");
            }
        }

        function deleteEvent(id) {
            appState.events = appState.events.filter(e => e.id !== id);
            saveState();
            renderCurrentTab();
            showToast("Rendez-vous supprimé");
        }

        function handleItemSearch(val) {
            searchQuery = val;
            renderCurrentTab();
        }

        function selectCategory(cat) {
            selectedCategory = cat;
            renderCurrentTab();
        }

        // --- INITIALISATION AU CHARGEMENT ---
        window.onload = function() {
            applyNightMode();
            updateFontSizeBadge();
            updateClock();
            setInterval(updateClock, 1000);
            updateBadges();
            updateMuteButtonUI();
            switchTab(appState.activeTab || 'assistant');
        };
    </script>
</body>
</html>
